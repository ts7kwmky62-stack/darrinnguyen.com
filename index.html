<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darrin Nguyen · Under construction</title>
<meta name="robots" content="noindex">
<meta name="description" content="Teaching machines what it means to be human. Somehow... they're teaching me more.">
<meta property="og:title" content="Darrin Nguyen">
<meta property="og:description" content="Under construction. Teaching machines what it means to be human. Somehow... they're teaching me more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a dark felt board up top (headline, co-founder, the 10-division directory), then plain ruled reading sections on paper. */
:root{
  --paper:#f4f6f8;      /* cool paper, not cream */
  --ink:#16191f;
  --muted:#4f5866;      /* 6.9:1 on paper */
  --rule:#c9cfd7;
  --board:#1d2024;      /* felt */
  --groove:#2a2e33;
  --letter:#f1efe9;     /* plastic letters, 14:1 on felt */
  --letter-dim:#b9bcc2; /* small letters, 8:1 on felt */
  --letter-soft:#dad8d2; /* reading text on felt, 12:1 */
  --pin:#d0a34a;        /* brass push-pin, used only for selection marks */
  --pin-dim:#7d6532;    /* faint brass for the nameplate's inner line */
  --plate:#24282d;      /* nameplate face, a step lighter than the felt */
  --collide:#66c2d2;    /* steel-teal, used ONLY on the word Collided (8:1 on felt) */
  --display:"Big Shoulders Display","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",ui-sans-serif,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1216;--ink:#e5e8ec;--muted:#a3acb8;--rule:#2c333c;--board:#191c20;--groove:#24282d;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f1216;--ink:#e5e8ec;--muted:#a3acb8;--rule:#2c333c;--board:#191c20;--groove:#24282d;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--body)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--pin);outline-offset:3px}
p{margin:0;max-width:65ch}
h2{font:800 clamp(30px,4.4vw,46px)/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}

/* The felt board */
.board{background-color:var(--board);background-image:repeating-linear-gradient(to bottom,transparent 0 30px,var(--groove) 30px 32px);color:var(--letter)}
.board .wrap{padding-block:40px 44px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;font:600 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--letter-dim)}
.top .brand{color:var(--letter-soft);font-size:16px}
.top .brand b{color:var(--pin);font-weight:800;letter-spacing:.14em}
.top nav{display:flex;gap:20px;flex-wrap:wrap}
.top a{text-decoration:none}.top a:hover{color:var(--letter)}
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:40px;align-items:center;margin-top:44px}
.hero h1{font:800 clamp(46px,8.6vw,108px)/.92 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.hero h1 span{display:block}
.hero h1 .hl{font-style:normal;color:var(--collide)}
.hero .lede{margin-top:22px;font-size:18px;color:var(--letter-dim);max-width:46ch}
/* Brass nameplate: same in both themes, because it's an object on the board */
.plaque{justify-self:end;display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center;background:var(--plate);color:var(--letter);padding:18px 20px;max-width:390px;border:2px solid var(--pin);outline:1px solid var(--pin-dim);outline-offset:-7px}
.plaque img{width:96px;height:96px;display:block}
.plaque b{font:800 26px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;display:block;color:var(--letter)}
.plaque small{display:block;font:600 13px/1.4 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--pin);margin:6px 0 8px}
.plaque p{font-size:14px;line-height:1.5;color:var(--letter-soft)}

/* Directory: same felt, no grooves, so nothing runs behind the letters */
.board.plain{background-image:none;border-top:1px solid var(--groove)}
.dir .wrap{padding-block:36px 52px}
.dir-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--letter);padding-bottom:10px}
.dir-head h2{color:var(--letter)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{font:600 15px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--letter-dim);background:transparent;border:2px solid transparent;padding:10px 12px;min-height:44px;cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--letter);border-color:var(--pin)}
.filters button:hover{color:var(--letter)}
/* Directory: three floors side by side, like the panels of a lobby board */
.floors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;margin-top:28px;align-items:start}
.floor-name{font:600 15px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--pin);margin:0 0 6px;padding-bottom:12px;border-bottom:1px solid var(--groove);display:flex;justify-content:space-between}
.floor-name span{color:var(--letter-dim)}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:22px;padding-top:16px}
.rows li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:baseline}
.code{font:600 14px/1 var(--display);letter-spacing:.14em;color:var(--letter-dim)}
.name{display:block;font:800 25px/1.05 var(--display);letter-spacing:.03em;text-transform:uppercase}
.what{display:block;margin-top:6px;font-size:16px;line-height:1.5;color:var(--letter-soft)}
.more{display:inline-block;margin-top:8px;font:600 14px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--pin);text-decoration:none;padding-block:6px}
.more::after{content:" \2193"}
.more:hover{text-decoration:underline}
.count{font:600 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--letter-dim);margin-top:24px}

/* Reading sections on paper */
.sec{padding-block:56px;border-bottom:1px solid var(--rule)}
.sec>.wrap>p.intro{margin-top:12px;color:var(--muted);font-size:18px}
.offer{margin-top:28px;display:grid;gap:0}
.offer>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:28px;padding:22px 0;border-top:1px solid var(--rule)}
.offer h3{font:700 21px/1.25 var(--body);margin:0}
.offer .who{color:var(--muted);margin-top:6px;font-size:15px}
.offer ul{margin:0;padding-left:20px;display:grid;gap:6px}
.fine{margin-top:12px;font-size:14px;color:var(--muted)}
.rules{margin:28px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
.rules li{padding:18px 0;border-top:1px solid var(--rule)}
.rules b{display:block;font:700 18px/1.3 var(--body)}
.rules span{display:block;color:var(--muted);margin-top:4px;font-size:16px}
.rules li.wide{grid-column:1/-1}
.hire{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:28px}
.hire>div{border-left:3px solid var(--ink);padding-left:16px}
.hire b{display:block;font:700 18px/1.3 var(--body)}
.hire span{display:block;color:var(--muted);margin-top:6px;font-size:16px}
.hire>div:nth-child(3){border-left-color:var(--pin)}
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:28px;align-items:start}
.contact p{font-size:19px}
footer{padding-block:28px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:820px){
  .hero,.offer>div,.contact{grid-template-columns:minmax(0,1fr)}
  .plaque{justify-self:start}
  .floors{grid-template-columns:minmax(0,1fr);gap:40px}
  .name{font-size:23px}
  .rules,.hire{grid-template-columns:minmax(0,1fr)}
}

/* Offer line + FIG. 1 (the unit's org chart, drawn like a technical figure) */
.offer-line{margin-top:20px;font:600 21px/1.4 var(--body);color:var(--letter);max-width:40ch}
.fig .wrap{padding-block:40px 44px}
.fig-label{font:600 15px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--letter-dim);margin:0 0 20px}
.fig-label span{color:var(--pin);border:1px solid var(--pin);padding:4px 8px;margin-right:10px}
.fig-scroll{overflow-x:auto}
.fig svg{display:block;width:100%;min-width:760px;height:auto}
.fig .ln{stroke:var(--letter-dim);stroke-width:1.5}
.fig .ln-brass{stroke:var(--pin);stroke-width:2.5}
.fig .dots circle{fill:var(--letter-dim)}
.fig .dots-brass circle{fill:var(--pin)}
.fig .bx,.fig .divs rect{fill:var(--plate);stroke:var(--letter-dim);stroke-width:1.5}
.fig .bx-brass{fill:var(--plate);stroke:var(--pin);stroke-width:3}
.fig text{font-family:var(--display);letter-spacing:.06em}
.fig .t-brass{fill:var(--pin);font-size:24px;font-weight:800}
.fig .t-main{fill:var(--letter);font-size:20px;font-weight:800}
.fig .t-sub{fill:var(--letter-dim);font-family:var(--body);font-size:14px;letter-spacing:0}
.fig .t-code{fill:var(--pin);font-size:16px;font-weight:600;letter-spacing:.14em}
.fig .t-div{fill:var(--letter-soft);font-family:var(--body);font-size:16px;letter-spacing:0}
.fig-note{margin-top:16px;color:var(--letter-dim);font-size:15px}

/* ===== One dark world (2026-10-22): every section sits on the felt ===== */
:root{color-scheme:dark}
body{background:var(--board);color:var(--letter)}
.sec{background:var(--board);border-bottom:1px solid var(--groove);padding-block:64px}
.sec h2{color:var(--letter)}
.sec>.wrap>p.intro{color:var(--letter-soft)}
.offer>div{border-top:1px solid var(--groove)}
.offer h3{font:800 24px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.offer h3 .tag{font:600 13px/1 var(--display);letter-spacing:.16em;color:var(--pin)}
.offer .who,.fine{color:var(--letter-dim)}
.offer ul{color:var(--letter-soft)}
.rules{counter-reset:roe}
.rules li{border-top:1px solid var(--groove);display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 14px}
.rules li::before{counter-increment:roe;content:"ROE-" counter(roe);grid-row:span 2;font:600 14px/1.6 var(--display);letter-spacing:.14em;color:var(--pin)}
.rules b{font:800 21px/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase}
.rules span{color:var(--letter-soft);margin-top:0}
.hire>div{border-left:3px solid var(--letter-dim)}
.hire b{font:800 21px/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase}
.hire span{color:var(--letter-soft)}
.contact p{color:var(--letter-soft)}
footer{background:var(--board);color:var(--letter-dim);border-top:1px solid var(--groove);font:600 14px/1 var(--display);letter-spacing:.14em;text-transform:uppercase}
footer b{color:var(--pin);font-weight:800}

/* ===== 8/10 polish (2026-10-22) ===== */
/* grooves every 48px; the hero sits on that rhythm */
.board{background-image:repeating-linear-gradient(to bottom,transparent 0 46px,var(--groove) 46px 48px)}
.board .wrap{padding-block:48px}
.hero{margin-top:48px}
@media (min-width:1100px){.hero h1{font-size:104px;line-height:96px}}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:28px;min-height:48px;padding:0 22px;border:2px solid var(--pin);color:var(--letter);text-decoration:none;font:800 18px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;transition:background-color .15s,color .15s}
.cta::after{content:"\2192";color:var(--pin);transition:transform .15s}
.cta:hover{background:var(--pin);color:var(--board)}
.cta:hover::after{color:var(--board);transform:translateX(4px)}
/* directory rows light up their route in FIG. 1 */
.rows li{padding:10px 12px;margin:-10px -12px;transition:background-color .15s}
.rows li:hover{background:var(--plate)}
.rows li:hover .code{color:var(--pin)}
.fig .divs rect,.fig .ln path{transition:stroke .15s,stroke-width .15s}
.fig .lit{stroke:var(--pin)!important;stroke-width:2.5!important}
.fig-hint{margin-top:6px;color:var(--letter-dim);font-size:14px}
/* steadier rhythm between sections */
.sec{padding-block:72px}
.sec h2{margin-bottom:4px}
@media (prefers-reduced-motion:reduce){.cta,.cta::after,.rows li,.fig .divs rect,.fig .ln path{transition:none}}

/* ===== 7.9 pass (2026-10-22) ===== */
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
section[id],main section[id]{scroll-margin-top:16px}
.skip{position:absolute;left:16px;top:-60px;z-index:10;background:var(--pin);color:var(--board);padding:10px 14px;font:800 15px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.skip:focus{top:12px}
/* letters stay on the grooves at every width */
@media (max-width:1099px){.hero h1{font-size:54px;line-height:48px}}
/* one orchestrated moment: the four lines drop onto the board, top to bottom */
@keyframes place{from{transform:translateY(-14px)}to{transform:none}}
.hero h1 span{animation:place .5s cubic-bezier(.2,.9,.3,1.2) both}
.hero h1 span:nth-child(2){animation-delay:.08s}.hero h1 span:nth-child(3){animation-delay:.16s}.hero h1 span:nth-child(4){animation-delay:.28s}
@media (prefers-reduced-motion:reduce){.hero h1 span{animation:none}}
/* phone: nav wraps cleanly under the brand, plate goes full width */
@media (max-width:820px){
  .top{flex-direction:column;align-items:flex-start;gap:12px}
  .top nav{gap:14px 18px}
  .plaque{max-width:none;width:100%}
  .offer-line{font-size:19px}
  .cta{width:100%;justify-content:center}
  .filters{width:100%}
  .fig .wrap{padding-block:36px}
}
.brand .by{color:var(--letter-dim);font-size:.82em;letter-spacing:.18em}

.hero h1 .hl{font-style:normal;color:#66c2d2}
.uc{display:inline-block;margin-top:28px;font:600 13px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--pin);border:1px dashed var(--pin);padding:7px 10px}
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <div class="top"><span class="brand"><b>NRG</b> <span class="by">· powered by</span> Gannon Talos Research Group</span></div>
    <div class="hero" style="grid-template-columns:minmax(0,1fr)">
      <div>
        <h1><span>Human &amp;</span><span>Artificial</span><span>Intelligence.</span><span><em class="hl">Collided</em>.</span></h1>
        <p class="offer-line">Teaching machines what it means to be human.<br>Somehow they're teaching me more.<br><span style="color:var(--letter-dim)">Context is everything.</span></p>
        <p class="uc">Under construction</p>
      </div>
    </div>
  </div>
</header>
<script data-goatcounter="https://ganon.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
